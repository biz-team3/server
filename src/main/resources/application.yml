server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  application:
    name: biz-team3-server
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

logging:
  level:
    com.bizteam3.server: debug

file:
  upload:
    root-dir: ./uploads
    url-prefix: /uploads

deepl:
  api-key: ${DEEPL_API_KEY:}
