server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  application:
    name: biz-team3-server
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

logging:
  level:
    com.bizteam3.server: debug

file:
  upload:
    root-dir: ./uploads
    url-prefix: /uploads
