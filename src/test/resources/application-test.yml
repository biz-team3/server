spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${TEST_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${TEST_DB_USERNAME:biz_team3}
    password: ${TEST_DB_PASSWORD:biz_team3}
    hikari:
      pool-name: BizTeam3TestHikariPool
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      initialization-fail-timeout: -1

  sql:
    init:
      mode: never

mybatis:
  config-location: classpath:mybatis/config/mybatis-config.xml
  mapper-locations: classpath:mybatis/mapper/*.xml

jwt:
  secret: ${TEST_JWT_SECRET:biz-team3-test-secret-biz-team3-test-secret-biz-team3-test-secret}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

file:
  upload:
    root-dir: ${TEST_UPLOAD_ROOT_DIR:./build/test-uploads}
    url-prefix: /uploads

logging:
  level:
    com.bizteam3.server: debug
    org.springframework.test.context: info
